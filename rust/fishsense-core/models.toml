[[model]]
name = "sam3"
version = "3.1"
default = true

[[model.artifact]]
targets = ["server"]
filename = "sam3.1_multiplex.pt"
sha256 = "0567debeec80ba4ac6369540c6c248025283cb3ff2b92827509e57e2b3541cb6"
