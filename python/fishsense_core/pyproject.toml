[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "fishsense_core._native"

[project]
name = "fishsense_core"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = [
    "numpy>=2.3.5",
    # Single headless OpenCV. Previously both opencv-python AND
    # opencv-contrib-python were declared: contrib is a superset of the base, so
    # one is redundant, and both install into `cv2/`, so which wins is
    # install-order dependent. Both are also non-headless, pulling X libraries
    # (libxcb.so.1 etc.) that a worker/headless container lacks. fishsense-core
    # uses no GUI (imshow/waitKey) and no contrib-only modules (aruco/ximgproc/…),
    # so the headless base build is correct, single, and container-safe.
    "opencv-python-headless>=4.11.0.86",
    "rawpy>=0.25.1",
    "scikit-image>=0.25.2",
]

[project.optional-dependencies]
# The laser detector runs a PyTorch checkpoint. Kept out of the base install:
# torch pulls its own CUDA runtime, which would both bloat every wheel and
# collide with the onnxruntime CPU/+cu12 split the released wheels rely on.
laser-detector = [
    "torch>=2.4",
    "segmentation-models-pytorch>=0.4",
    "huggingface-hub>=0.26",
]
# RectifiedImage (whole-image undistortion) needs the API SDK's CameraIntrinsics
# model. The SDK is git-only, so keeping it out of the base deps is what makes
# the published wheel `pip install`-able at all — a bare `fishsense-api-sdk` in
# Requires-Dist has no locator and pip cannot resolve it. The laser detector
# and its own output rectification (raw cv2.undistortPoints) do NOT need it.
rectified = ["fishsense-api-sdk"]

[tool.uv.sources]
fishsense-api-sdk = { git = "https://github.com/UCSD-E4E/fishsense-api-sdk.git" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "pylint>=4.0.4",
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.1",
    # Not a base dependency (see [project.optional-dependencies].rectified), but
    # the test suite covers RectifiedImage, so the dev/CI env needs it. Resolved
    # from git via [tool.uv.sources].
    "fishsense-api-sdk",
]
