name: Rust

on: [push]

env:
  CARGO_TERM_COLOR: always
  # cargo test creates a real ORT session (active_provider_defaults_to_cpu);
  # ORT's intra-op thread-pool init has deadlocked on the CI runners, so run
  # the session single-threaded here. See FishSegmentation::intra_threads.
  FISHSENSE_ORT_INTRA_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenblas-dev
    - name: Build
      run: cargo build --verbose
    # NOT --all-features: `cuda` pulls `ort/load-dynamic` while the default
    # pulls `ort/download-binaries` — mutually-exclusive ORT linking modes that
    # together leave `ort::execution_providers` without the provider types
    # (E0433). `coreml`'s provider only exists on macOS. So lint the default set
    # plus the CUDA path (valid on Linux; the +cu12 wheel is built this way);
    # coreml is linted on the macOS job.
    - name: Lint (default features)
      run: cargo clippy --verbose --all-targets -- -D warnings
    - name: Lint (cuda)
      run: cargo clippy --verbose --all-targets --no-default-features --features cuda -- -D warnings
    - name: Run tests
      run: cargo test --verbose

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: brew install openblas
    - name: Build
      run: cargo build --verbose
    # See the ubuntu job. macOS lints the default set plus the CoreML path
    # (its provider type is macOS-only); CUDA is Linux/Windows-only, linted on
    # the ubuntu job.
    - name: Lint (default features)
      run: cargo clippy --verbose --all-targets -- -D warnings
    - name: Lint (coreml)
      run: cargo clippy --verbose --all-targets --no-default-features --features coreml -- -D warnings
    - name: Run tests
      run: cargo test --verbose
