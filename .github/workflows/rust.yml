name: Rust

on: [push]

env:
  CARGO_TERM_COLOR: always
  # cargo test creates a real ORT session (active_provider_defaults_to_cpu);
  # ORT's intra-op thread-pool init has deadlocked on the CI runners, so run
  # the session single-threaded here. See FishSegmentation::intra_threads.
  FISHSENSE_ORT_INTRA_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenblas-dev
    - name: Build
      run: cargo build --verbose
    - name: Lint
      run: cargo clippy --verbose --all-targets --all-features -- -D warnings
    - name: Run tests
      run: cargo test --verbose

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: brew install openblas
    - name: Build
      run: cargo build --verbose
    - name: Lint
      run: cargo clippy --verbose --all-targets --all-features -- -D warnings
    - name: Run tests
      run: cargo test --verbose
