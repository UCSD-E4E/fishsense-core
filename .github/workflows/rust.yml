name: Rust

on: [push]

env:
  CARGO_TERM_COLOR: always
  # cargo test creates a real ORT session (active_provider_defaults_to_cpu);
  # ORT's intra-op thread-pool init has deadlocked on the CI runners, so run
  # the session single-threaded here. See FishSegmentation::intra_threads.
  FISHSENSE_ORT_INTRA_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenblas-dev
    - name: Build
      run: cargo build --verbose
    # Lint default features only — NOT --all-features. `--all-features` fuses
    # `cuda` (→ ort/load-dynamic) with the default (→ ort/download-binaries),
    # two mutually-exclusive ORT linking modes. And under CI's ort resolution
    # `ort::execution_providers::CUDAExecutionProvider` / `CoreMLExecutionProvider`
    # aren't exposed even when their feature is enabled alone, so clippy on the
    # `cuda`/`coreml` sets fails to resolve them (E0433). Those tiny cfg-gated
    # EP blocks are compiled by the `+cu12` release build (cuda); linting them
    # in the standard CI is not worth a broken pipeline.
    - name: Lint
      run: cargo clippy --verbose --all-targets -- -D warnings
    # fishsense-mobile runs in the field with no Internet, on this crate built
    # `default-features = false, features = ["coreml"]`. Models reach it through
    # the app bundle, never a download, so that build must not link an HTTP
    # client at all. `-e normal` leaves out build-dependencies: build.rs may
    # download (it pins and checks FishIAL), the library may not.
    - name: Mobile build has no runtime network code
      run: |
        hits=$(cargo tree -p fishsense-core -e normal --no-default-features --features coreml \
          | grep -E '\b(reqwest|hyper|ureq|curl)\b' || true)
        if [ -n "$hits" ]; then
          echo "::error::the mobile (coreml) build depends on an HTTP client:"
          echo "$hits"
          exit 1
        fi
    - name: Run tests
      run: cargo test --verbose

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: brew install openblas
    - name: Build
      run: cargo build --verbose
    # See the ubuntu job: default features only, not --all-features.
    - name: Lint
      run: cargo clippy --verbose --all-targets -- -D warnings
    - name: Run tests
      run: cargo test --verbose
