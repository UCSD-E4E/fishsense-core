name: Rust

on: [push]

env:
  CARGO_TERM_COLOR: always
  # cargo test creates a real ORT session (active_provider_defaults_to_cpu);
  # ORT's intra-op thread-pool init has deadlocked on the CI runners, so run
  # the session single-threaded here. See FishSegmentation::intra_threads.
  FISHSENSE_ORT_INTRA_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    # The toolchain and native libs (Rust, OpenBLAS, OpenSSL, pkg-config) all
    # come from the flake dev shell — same environment as local development.
    - uses: DeterminateSystems/nix-installer-action@main
    - name: Build
      run: nix develop --command cargo build --verbose
    - name: Lint
      run: nix develop --command bash -c "cargo clippy --verbose --all-targets --all-features -- -D warnings"
    - name: Run tests
      run: nix develop --command cargo test --verbose

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v4
    - uses: DeterminateSystems/nix-installer-action@main
    - name: Build
      run: nix develop --command cargo build --verbose
    - name: Lint
      run: nix develop --command bash -c "cargo clippy --verbose --all-targets --all-features -- -D warnings"
    - name: Run tests
      run: nix develop --command cargo test --verbose
