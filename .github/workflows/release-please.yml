name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to upload wheels to (e.g. fishsense-core-v1.7.0). Leave blank for the normal release-please flow."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # One release (fishsense-core-v<X.Y.Z>, which carries the wheels), but the
  # underscore tag lives on: fishsense-mobile pins it as a git dep and records
  # it as core_version provenance. A bare tag, no GitHub Release. Its own job so
  # a failure here can't hold up the wheels, and idempotent so a
  # workflow_dispatch rerun with the hyphen tag (re)creates it.
  tag-python:
    needs: release-please
    if: |
      always() && (
        needs.release-please.outputs.release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.tag != '')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add the fishsense_core-v<X.Y.Z> tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag != '' && inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            fishsense-core-v*) ;;
            *) echo "::error::expected a fishsense-core-v<X.Y.Z> tag, got '$TAG'"; exit 1 ;;
          esac
          py_tag="fishsense_core-v${TAG#fishsense-core-v}"
          sha=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
          if existing=$(gh api "repos/$REPO/commits/$py_tag" --jq .sha 2>/dev/null); then
            if [ "$existing" = "$sha" ]; then
              echo "$py_tag already on $sha"
              exit 0
            fi
            echo "::error::$py_tag is on $existing, but $TAG is on $sha"
            exit 1
          fi
          gh api "repos/$REPO/git/refs" -f "ref=refs/tags/$py_tag" -f "sha=$sha"
          echo "created $py_tag on $sha"

  build-wheel:
    needs: release-please
    if: |
      always() && (
        needs.release-please.outputs.release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.tag != '')
      )
    runs-on: ubuntu-latest
    # Two builds (CPU + CUDA).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build CPU wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --strip --manifest-path python/fishsense_core/Cargo.toml --out target/wheels --find-interpreter
          target: x86_64-unknown-linux-gnu
          manylinux: 2_34
          before-script-linux: |
            dnf install -y dnf-plugins-core epel-release
            dnf config-manager --set-enabled crb
            dnf install -y openblas-devel openssl-devel

      # The CUDA variant: built with `--features cuda` → ort's load-dynamic mode
      # (the cdylib links no ORT; at runtime it loads libonnxruntime.so from the
      # `onnxruntime-gpu` pip package, which — unlike pyke's prebuilt ORT-CUDA —
      # is built for manylinux_2_27 and loads on glibc < 2.38). Two manifest
      # tweaks for this build only: a `+cu12` PEP 440 local version (so its wheel
      # filenames don't collide with the CPU ones on the release page) and an
      # `onnxruntime-gpu` runtime dependency (== the ONNX Runtime version `ort`
      # 2.0.0-rc.12 targets).
      - name: Prepare the CUDA build manifest
        run: |
          sed -i 's/^version = "\([^"]*\)"$/version = "\1+cu12"/' python/fishsense_core/Cargo.toml
          sed -i '/^dependencies = \[$/a\    "onnxruntime-gpu==1.24.*",' python/fishsense_core/pyproject.toml
          grep '^version' python/fishsense_core/Cargo.toml
          grep -A8 '^dependencies = \[' python/fishsense_core/pyproject.toml

      - name: Build CUDA wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --strip --features cuda --manifest-path python/fishsense_core/Cargo.toml --out target/wheels-cuda --find-interpreter
          target: x86_64-unknown-linux-gnu
          manylinux: 2_34
          before-script-linux: |
            dnf install -y dnf-plugins-core epel-release
            dnf config-manager --set-enabled crb
            dnf install -y openblas-devel openssl-devel

      - name: Restore manifests
        if: always()
        run: git checkout -- python/fishsense_core/Cargo.toml python/fishsense_core/pyproject.toml

      - name: Upload wheels to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag != '' && inputs.tag || needs.release-please.outputs.tag_name }}
        run: gh release upload --clobber "$TAG" target/wheels/*.whl target/wheels-cuda/*.whl
