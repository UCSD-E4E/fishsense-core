name: Python

on: [push]

defaults:
  run:
    working-directory: python/fishsense_core

jobs:
  pylint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@v4
    - uses: DeterminateSystems/nix-installer-action@main
    # The flake (Rust, uv, OpenBLAS, OpenSSL, pkg-config) lives at the repo
    # root; steps run in python/fishsense_core, so reference it by absolute
    # path. uv provisions the matrix Python itself, so the flake's own Python
    # pin doesn't constrain the version matrix.
    - name: Install dependencies
      run: nix develop "$GITHUB_WORKSPACE" --command bash -c "uv sync --group dev --python ${{ matrix.python-version }}"
    - name: Analysing the code with pylint
      run: nix develop "$GITHUB_WORKSPACE" --command bash -c "uv run --no-sync pylint fishsense_core/**/*.py"

  test-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      # The native extension links system OpenBLAS (via ndarray-linalg's
      # `openblas-system`) and bundles ONNX Runtime; both spin up thread
      # pools sized to the CPU count on first use, and on the GitHub runners
      # the ORT pool's init has deadlocked (the ORT C call holds the GIL, so
      # the interpreter wedges with it — see FishSegmentation::intra_threads).
      # Serialize all of them; the 42-test suite has no need for parallelism.
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      FISHSENSE_ORT_INTRA_THREADS: "1"
      # Where tests/conftest.py writes the faulthandler dump if something
      # still wedges past its watchdog (printed by the "Show hang dump" step).
      FISHSENSE_HANG_DUMP: /tmp/fishsense-hang.txt
    steps:
    - uses: actions/checkout@v4
    - uses: DeterminateSystems/nix-installer-action@main
    - name: Install dependencies
      run: nix develop "$GITHUB_WORKSPACE" --command bash -c "uv sync --group dev --python ${{ matrix.python-version }}"
    # Load the native extension on its own first so an import-time deadlock
    # (the Rust extension pulls in rayon/tokio) surfaces here instead of
    # silently hanging the coverage run below.
    - name: Import smoke test (no coverage)
      run: nix develop "$GITHUB_WORKSPACE" --command bash -c "uv run --no-sync python -c 'import fishsense_core; import fishsense_core._native; print(\"import ok\")'"
    # --timeout: if a test still hangs (e.g. a thread-pool deadlock the env
    # vars above didn't catch), pytest-timeout dumps every thread's stack and
    # fails that test, instead of the job silently burning to its timeout.
    - name: Run tests
      run: nix develop "$GITHUB_WORKSPACE" --command bash -c "uv run --no-sync pytest --timeout=120 --timeout-method=thread --cov=fishsense_core --cov-report=xml --cov-report=html"
    - name: Show hang dump
      if: failure()
      run: cat "${FISHSENSE_HANG_DUMP}" 2>/dev/null || echo "(no hang dump — failure was not a watchdog timeout)"
