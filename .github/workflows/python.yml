name: Python

on: [push]

defaults:
  run:
    working-directory: python/fishsense_core

jobs:
  pylint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenblas-dev
        python -m pip install --upgrade pip uv
        uv sync --group dev
    - name: Analysing the code with pylint
      run: uv run --no-sync pylint fishsense_core/**/*.py

  test-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      # The native extension links system OpenBLAS (via ndarray-linalg's
      # `openblas-system`) and bundles ONNX Runtime; both spin up thread
      # pools sized to the CPU count on first use, and on the GitHub runners
      # the ORT pool's init has deadlocked (the ORT C call holds the GIL, so
      # the interpreter wedges with it — see FishSegmentation::intra_threads).
      # Serialize all of them; the 42-test suite has no need for parallelism.
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      FISHSENSE_ORT_INTRA_THREADS: "1"
      # Where tests/conftest.py writes the faulthandler dump if something
      # still wedges past its watchdog (printed by the "Show hang dump" step).
      FISHSENSE_HANG_DUMP: /tmp/fishsense-hang.txt
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenblas-dev
        python -m pip install --upgrade pip uv
        uv sync --group dev
    # Load the native extension on its own first so an import-time deadlock
    # (the Rust extension pulls in rayon/tokio) surfaces here instead of
    # silently hanging the coverage run below.
    - name: Import smoke test (no coverage)
      run: uv run --no-sync python -c "import fishsense_core; import fishsense_core._native; print('import ok')"
    # --timeout: if a test still hangs (e.g. a thread-pool deadlock the env
    # vars above didn't catch), pytest-timeout dumps every thread's stack and
    # fails that test, instead of the job silently burning to its timeout.
    - name: Run tests
      run: uv run --no-sync pytest --timeout=120 --timeout-method=thread --cov=fishsense_core --cov-report=xml --cov-report=html
    - name: Show hang dump
      if: failure()
      run: cat "${FISHSENSE_HANG_DUMP}" 2>/dev/null || echo "(no hang dump — failure was not a watchdog timeout)"

  # The torch-backed tests: the SAM 3.1 adapter's autocast and the keypoint
  # model's lift, batching, network shape and checkpoint round trip. They skip
  # wherever torch is absent, which is the base job above, so this job installs
  # CPU torch + timm (the [headtail-keypoints] extra, from the CPU index so the
  # runner is not asked for a CUDA runtime) and runs only the files that use
  # them. A test that still skips here for want of torch is a failure, so the
  # step greps the skip summary.
  test-ubuntu-torch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      FISHSENSE_ORT_INTRA_THREADS: "1"
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenblas-dev
        python -m pip install --upgrade pip uv
        uv sync --group dev
        uv pip install --torch-backend=cpu torch timm
    - name: Run the torch-backed tests
      run: |
        uv run --no-sync pytest --timeout=300 -rs tests/test_headtail_keypoints.py tests/test_fish_at_dot.py | tee pytest.log
        if grep -q "could not import 'torch'" pytest.log; then echo "torch tests skipped"; exit 1; fi
